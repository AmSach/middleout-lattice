[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "middleout-lattice"
version = "0.2.0"
description = "Neural compression for model files, tensor archives, and arbitrary data"
readme = "README.md"
license = {text = "Proprietary — All Rights Reserved"}
requires-python = ">=3.10"
authors = [
    {name = "MiddleOut Lattice Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "zstandard>=0.21.0",
    "brotli>=1.0.9",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
neural = [
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "range-coder>=0.2.0",
]
training = [
    "torch>=2.0.0",
    "lightning>=2.0.0",
    "tensorboard>=2.13.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
middleout-train = "scripts.train:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["middleout_lattice*", "scripts*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
